[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-file-builder"
version = "2.0.3"
description = "Build weather files (EPW, TMY) from ERA5 reanalysis data for building energy simulation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Justin McCarty", email = "mccarty.justin.f@gmail.com"},
]
keywords = ["weather", "ERA5", "EPW", "TMY", "building simulation", "EnergyPlus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "ecmwf-datastores-client>=0.1.0",
    "xarray>=2023.1.0",
    "netcdf4>=1.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pyarrow>=14.0.0",
    "pvlib>=0.13.0",
    "pyepwmorph>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/justinfmccarty/weather_file_builder"
Documentation = "https://github.com/justinfmccarty/weather_file_builder#readme"
Repository = "https://github.com/justinfmccarty/weather_file_builder"
Issues = "https://github.com/justinfmccarty/weather_file_builder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_file_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
